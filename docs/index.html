      /* ------------------------------ helpers ------------------------------ */

      // Parse a plain YYYY-MM-DD as local noon so it never slips a day on any tz.
      function asDate(ymd) {
        return new Date(ymd + "T12:00:00");
      }

      function fmtDate(ymd, opts) {
        return asDate(ymd).toLocaleDateString("en-US", opts || { weekday: "long", month: "long", day: "numeric" });
      }

      function fmtDuration(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m ? h + "h " + m + "m" : h + "h";
      }

      function nightsBetween(startYmd, endYmd) {
        return Math.round((asDate(endYmd) - asDate(startYmd)) / 86400000);
      }

      // Sort untimed items last, timed items chronologically.
      function itemMinutes(time) {
        if (!time) return Infinity;
        const m = time.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
        if (!m) return Infinity;
        let h = parseInt(m[1], 10) % 12;
        if (m[3].toUpperCase() === "PM") h += 12;
        return h * 60 + parseInt(m[2], 10);
      }

      function useCountdown(targetIso) {
        const target = useMemo(() => new Date(targetIso).getTime(), [targetIso]);
        const [now, setNow] = useState(() => Date.now());
        useEffect(() => {
          const id = setInterval(() => setNow(Date.now()), 1000);
          return () => clearInterval(id);
        }, []);
        const diff = target - now;
        if (diff <= 0) return null;
        return {
          days: Math.floor(diff / 86400000),
          hours: Math.floor((diff % 86400000) / 3600000),
          mins: Math.floor((diff % 3600000) / 60000),
          secs: Math.floor((diff % 60000) / 1000),
        };
      }

      // Checklist state persists per device via localStorage — it is not shared
      // between people, since the page is static.
      function useChecklist(key) {
        const [checked, setChecked] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem(key) || "{}");
          } catch (e) {
            return {};
          }
        });
        useEffect(() => {
          try {
            localStorage.setItem(key, JSON.stringify(checked));
          } catch (e) { /* private mode — checkboxes just won't persist */ }
        }, [key, checked]);
        const toggle = useCallback((id) => {
          setChecked((prev) => ({ ...prev, [id]: !prev[id] }));
        }, []);
        return [checked, toggle];
      }

      /* ----------------------------- components ---------------------------- */

      function Countdown() {
        const cd = useCountdown(TRIP.departureInstant);
        if (!cd) {
          const past = new Date(TRIP.departureInstant).getTime() < Date.now();
          return <div className="card cd-banner">{past ? "🌴 Wheels up — enjoy it" : "Boarding time"}</div>;
        }
        const cells = [
          { n: cd.days, l: "Days" },
          { n: cd.hours, l: "Hours" },
          { n: cd.mins, l: "Mins" },
          { n: cd.secs, l: "Secs" },
        ];
        return (
          <div className="countdown">
            {cells.map((c) => (
              <div className="cd-cell" key={c.l}>
                <div className="cd-num">{String(c.n).padStart(2, "0")}</div>
                <div className="cd-label">{c.l}</div>
              </div>
            ))}
          </div>
        );
      }

      function FlightCard({ f }) {
        const meta = [
          f.airline && { k: "Airline", v: f.airline },
          f.flightNo && { k: "Flight", v: f.flightNo },
          f.confirmation && { k: "Confirmation", v: f.confirmation },
          f.terminal && { k: "Terminal", v: f.terminal },
          f.seats && { k: "Seats", v: f.seats },
        ].filter(Boolean);
        const missing = ["airline", "flightNo", "confirmation"].filter((k) => !f[k]);
        return (
          <div className="flight">
            <div className="flight-top">
              <div className="flight-label">{f.label}</div>
              <div className="flight-date">{fmtDate(f.date, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</div>
            </div>
            <div className="leg">
              <div className="leg-end">
                <div className="leg-time">{f.from.time}</div>
                <div className="leg-code">{f.from.code}</div>
                <div className="leg-city">{f.from.city}</div>
                <div className="leg-tz">{f.from.tz}</div>
              </div>
              <div className="leg-mid">
                <div>✈️</div>
                <div className="leg-line" />
                <div>{fmtDuration(f.durationMins)}</div>
              </div>
              <div className="leg-end right">
                <div className="leg-time">{f.to.time}</div>
                <div className="leg-code">{f.to.code}</div>
                <div className="leg-city">{f.to.city}</div>
                <div className="leg-tz">{f.to.tz}</div>
              </div>
            </div>
            <div className="flight-meta">
              {meta.map((m) => (
                <div className="meta-pill" key={m.k}>{m.k}: <b>{m.v}</b></div>
              ))}
              {missing.map((k) => (
                <div className="meta-pill todo" key={k}>{k === "flightNo" ? "flight number" : k} — TBD</div>
              ))}
            </div>
          </div>
        );
      }

      function DayCard({ day, index }) {
        const items = useMemo(
          () => [...day.items].sort((a, b) => itemMinutes(a.time) - itemMinutes(b.time)),
          [day]
        );
        return (
          <div className="day">
            <div className="day-head">
              <span className="day-num">DAY {index + 1}</span>
              <span className="day-date">{fmtDate(day.date)}</span>
              {day.title && <span className="day-title">· {day.title}</span>}
            </div>
            <div className="day-body">
              {items.length === 0 ? (
                <div className="empty">Wide open. Nothing locked in yet.</div>
              ) : (
                items.map((it, i) => (
                  <div className="item" key={i}>
                    <div className={"item-time" + (it.time ? "" : " none")}>{it.time || "—"}</div>
                    <div className="item-icon">{TYPE_ICONS[it.type] || TYPE_ICONS.default}</div>
                    <div>
                      <div className="item-title">{it.title}</div>
                      {it.note && <div className="item-note">{it.note}</div>}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        );
      }

      function Overview() {
        const nights = nightsBetween(TRIP.startDate, TRIP.endDate);
        const planned = DAYS.reduce((n, d) => n + d.items.length, 0);
        return (
          <div>
            <div className="section-title">Countdown to takeoff</div>
            <div className="section-note">Outbound departs Tijuana {fmtDate(TRIP.startDate, { month: "long", day: "numeric" })} at {FLIGHTS[0].from.time}.</div>
            <Countdown />
            <div className="stat-row">
              <div className="stat">
                <div className="stat-val">{nights} nights</div>
                <div className="stat-key">{fmtDate(TRIP.startDate, { month: "short", day: "numeric" })} – {fmtDate(TRIP.endDate, { month: "short", day: "numeric" })}</div>
              </div>
              <div className="stat">
                <div className="stat-val">{STAYS.length ? STAYS[0].name : "Not booked"}</div>
                <div className="stat-key">Where we're staying</div>
              </div>
              <div className="stat">
                <div className="stat-val">{planned} items</div>
                <div className="stat-key">On the itinerary</div>
              </div>
            </div>
            {STAYS.length > 0 && (
              <div>
                <div className="section-title" style={{ marginTop: 24 }}>Stay</div>
                {STAYS.map((s) => (
                  <div className="card" key={s.name}>
                    <div className="item-title">{s.name}</div>
                    {s.area && <div className="item-note">{s.area}</div>}
                    {s.address && (
                      <div className="item-note">
                        <a className="idea-link" target="_blank" rel="noreferrer"
                           href={"https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.address)}>
                          {s.address} ↗
                        </a>
                      </div>
                    )}
                    <div className="flight-meta">
                      {s.checkIn && <div className="meta-pill">Check in: <b>{fmtDate(s.checkIn, { month: "short", day: "numeric" })}{s.checkInTime ? " " + s.checkInTime : ""}</b></div>}
                      {s.checkOut && <div className="meta-pill">Check out: <b>{fmtDate(s.checkOut, { month: "short", day: "numeric" })}{s.checkOutTime ? " " + s.checkOutTime : ""}</b></div>}
                      {s.confirmation && <div className="meta-pill">Confirmation: <b>{s.confirmation}</b></div>}
                      {s.phone && <div className="meta-pill">Phone: <b>{s.phone}</b></div>}
                    </div>
                  </div>
                ))}
              </div>
            )}
            {TRAVELERS.length > 0 && (
              <div>
                <div className="section-title" style={{ marginTop: 24 }}>Who's going</div>
                <div className="card">
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                    {TRAVELERS.map((t) => (
                      <div className="meta-pill" key={t.name}>{t.emoji} <b>{t.name}</b></div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function Packing() {
        const [checked, toggle] = useChecklist("pv2026-packing");
        const all = PACKING.flatMap((g) => g.items.map((i) => g.cat + "/" + i));
        const done = all.filter((id) => checked[id]).length;
        return (
          <div>
            <div className="section-title">Packing</div>
            <div className="section-note">Saved on this device only — everyone gets their own checkboxes.</div>
            <div className="pack-progress">{done} of {all.length} packed</div>
            <div className="pack-grid">
              {PACKING.map((g) => (
                <div className="card" key={g.cat}>
                  <div className="pack-cat">{g.cat}</div>
                  {g.items.map((item) => {
                    const id = g.cat + "/" + item;
                    return (
                      <label className={"check" + (checked[id] ? " done" : "")} key={id}>
                        <input type="checkbox" checked={!!checked[id]} onChange={() => toggle(id)} />
                        <span>{item}</span>
                      </label>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        );
      }

      function App() {
        const [tab, setTab] = useState("overview");
        return (
          <div className="app">
            <style>{styles}</style>

            <header className="header">
              <div className="header-row">
                <div>
                  <div className="header-title">{TRIP.title} {TRIP.year}</div>
                  <div className="header-sub">
                    {fmtDate(TRIP.startDate, { month: "short", day: "numeric" })} – {fmtDate(TRIP.endDate, { month: "short", day: "numeric", year: "numeric" })}
                  </div>
                </div>
                <div className="route-chip">
                  TIJ <span className="arrow">→</span> PVR <span className="arrow">→</span> TIJ
                </div>
              </div>
            </header>

            <nav className="tabs">
              {TABS.map((t) => (
                <button
                  key={t.id}
                  className={"tab" + (tab === t.id ? " active" : "")}
                  onClick={() => setTab(t.id)}
                >
                  {t.label}
                </button>
              ))}
            </nav>

            <main className="content">
              {tab === "overview" && <Overview />}

              {tab === "flights" && (
                <div>
                  <div className="section-title">Flights</div>
                  <div className="section-note">Times shown are local to each airport. Puerto Vallarta is 1 hour ahead of Tijuana.</div>
                  {FLIGHTS.map((f) => <FlightCard f={f} key={f.id} />)}
                </div>
              )}

              {tab === "itinerary" && (
                <div>
                  <div className="section-title">Day by day</div>
                  <div className="section-note">{nightsBetween(TRIP.startDate, TRIP.endDate) + 1} days on the ground. Empty days are still up for grabs.</div>
                  {DAYS.map((d, i) => <DayCard day={d} index={i} key={d.date} />)}
                </div>
              )}

              {tab === "ideas" && (
                <div>
                  <div className="section-title">Ideas</div>
                  <div className="section-note">Nothing here is committed — move things onto the itinerary once they're decided.</div>
                  <div className="card">
                    {IDEAS.map((idea, i) => (
                      <div className="idea" key={i}>
                        <span className="idea-cat">{idea.cat}</span>
                        <div style={{ minWidth: 0 }}>
                          <div className="idea-name">{idea.name}</div>
                          {idea.note && <div className="idea-note">{idea.note}</div>}
                          {idea.link && (
                            <a className="idea-link" href={idea.link} target="_blank" rel="noreferrer">Open ↗</a>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {tab === "packing" && <Packing />}

              {tab === "info" && (
                <div>
                  <div className="section-title">Good to know</div>
                  <div className="section-note">General guidance, not a forecast — check the weather again the week before.</div>
                  <div className="card">
                    {KNOW_BEFORE.map((k) => (
                      <div className="know" key={k.title}>
                        <div className="know-icon">{k.icon}</div>
                        <div>
                          <div className="know-title">{k.title}</div>
                          <div className="know-body">{k.body}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>

            <footer className="footer">
              Puerto Vallarta {TRIP.year} · updated as plans firm up
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
